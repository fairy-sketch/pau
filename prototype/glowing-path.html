<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATH glowing path sketches</title>
<style>
@font-face { font-family: "Satoshi"; src: url("fonts/Satoshi-Variable.woff2") format("woff2"); font-weight: 300 900; font-display: swap; }
@font-face { font-family: "Switzer"; src: url("fonts/Switzer-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Variable.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }
:root {
  /* Layout: a grid of cards, each drawing the stage progress as a path whose travelled part glows lime. */
  --bg: #f7f7f8; --surface: #ffffff; --soft: #edf0f5; --hairline: #e1e5ec;
  --text: #141414; --text-2: #5f6672; --accent: #b3ff3b;
  --heading: "Satoshi", "Helvetica Neue", Arial, sans-serif;
  --body: "Switzer", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
/* The panel the path sits on. Dark makes the glow read; light keeps the calm look. */
body[data-panel="dark"] { --panel: #141414; --ahead: #3a3a3a; --under: transparent; --node: #141414; --node-line: #5a5a5a; --panel-text: #ffffff; --panel-2: #a3a8b3; --glow: .95; }
body[data-panel="light"] { --panel: #f7f7f8; --ahead: #d5dae3; --under: #141414; --node: #ffffff; --node-line: #b9c0cc; --panel-text: #141414; --panel-2: #5f6672; --glow: .8; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
h1, h2, p { margin: 0; }
.page { max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; }
.eyebrow { font: 500 11px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
h1 { font: 900 clamp(32px, 7vw, 44px)/1.05 var(--heading); letter-spacing: -.03em; margin: 8px 0 12px; text-wrap: balance; }
.intro { color: var(--text-2); max-width: 62ch; }
.seg { display: inline-flex; margin-top: 20px; background: var(--soft); border-radius: 999px; padding: 4px; }
.seg button { height: 36px; padding: 0 16px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(17,17,17,.1); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-top: 28px; }
.card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 20px; box-shadow: 0 1px 2px rgba(17,17,17,.04), 0 6px 20px rgba(17,17,17,.05); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.card h2 { font: 700 20px/1.2 var(--heading); letter-spacing: -.01em; margin-top: 4px; }
.panel { background: var(--panel); border-radius: 16px; padding: 16px 16px 14px; transition: background .3s ease; }
.panel svg { display: block; width: 100%; height: auto; overflow: visible; }
.pmeta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; color: var(--panel-text); }
.pmeta b { font-weight: 600; }
.pmeta .eyebrow, .pmeta .s { color: var(--panel-2); }
.s { font-size: 13px; }
.sub { color: var(--text-2); font-size: 13px; }
.row { display: flex; gap: 8px; }
.feed { flex: 1; height: 48px; border-radius: 12px; background: var(--accent); font-weight: 600; transition: transform .12s ease; }
.feed:active { transform: scale(.96); }
.reset { height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--hairline); color: var(--text-2); font-size: 13px; font-weight: 500; }

/* path layers */
.ahead { fill: none; stroke: var(--ahead); stroke-width: 3; stroke-linecap: round; stroke-dasharray: .6 2.2; }
.under { fill: none; stroke: var(--under); stroke-width: 8; stroke-linecap: round; transition: stroke-dasharray .9s cubic-bezier(.2,.8,.2,1); }
.halo { fill: none; stroke: var(--accent); stroke-width: 16; stroke-linecap: round; opacity: var(--glow); filter: blur(9px); transition: stroke-dasharray .9s cubic-bezier(.2,.8,.2,1); animation: breathe 2.8s ease-in-out infinite; }
.done { fill: none; stroke: var(--accent); stroke-width: 4.5; stroke-linecap: round; transition: stroke-dasharray .9s cubic-bezier(.2,.8,.2,1); }
.spark { fill: none; stroke: #ffffff; stroke-width: 4.5; stroke-linecap: round; stroke-dasharray: 2.5 400; animation: run 2.6s cubic-bezier(.5,0,.5,1) infinite; }
@keyframes run { from { stroke-dashoffset: 3px; opacity: 0; } 12% { opacity: .9; } 88% { opacity: .9; } to { stroke-dashoffset: calc(var(--p) * -1px + 2.5px); opacity: 0; } }
@keyframes breathe { 50% { opacity: calc(var(--glow) * .55); } }
.node { fill: var(--node); stroke: var(--node-line); stroke-width: 2; transition: fill .3s ease, stroke .3s ease; }
.node.lit { fill: var(--accent); stroke: var(--text); }
.node.pop { animation: pop .6s cubic-bezier(.34,1.56,.64,1); transform-box: fill-box; transform-origin: center; }
@keyframes pop { 40% { transform: scale(2); } }
.you { fill: var(--accent); stroke: var(--text); stroke-width: 2.5; }
.youhalo { fill: var(--accent); opacity: .5; filter: blur(6px); transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { from { transform: scale(.6); opacity: .7; } to { transform: scale(2.2); opacity: 0; } }
.mover { transition: transform .9s cubic-bezier(.2,.8,.2,1); }
.goal { fill: var(--panel-text); font: 700 11px var(--heading); }
.lab { fill: var(--panel-2); font: 500 8px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.guide { stroke: var(--ahead); stroke-width: 1.5; fill: none; opacity: .7; }
@media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation: none !important; transition: none !important; } .spark { display: none; } }
</style>
</head>
<body data-panel="dark">
<div class="page">
  <div class="eyebrow">PATH · sketches, round 2</div>
  <h1>Your stage as a glowing path</h1>
  <p class="intro">Four ways to draw progress as an actual path. The part you have travelled glows lime, a spark keeps running along it, and each session you log pushes the glow further towards the goal.</p>
  <div class="seg" role="group" aria-label="Panel">
    <button data-panel="dark" aria-pressed="true">Dark panel</button>
    <button data-panel="light" aria-pressed="false">Light panel</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
"use strict";
const PER_STAGE = 12, STAGES = ["Foundation", "Build", "Sharpen", "Test", "Recover"], START = 12 + 5;
const SKETCHES = [
  { id: "trail", name: "Trail", line: "A winding route seen from above. Stages are waypoints, and the goal sits at the far end.", d: "M18 150 C 70 152, 62 92, 112 100 S 168 162, 208 112 S 244 34, 302 36", box: "0 0 320 180" },
  { id: "switch", name: "Switchbacks", line: "The path climbs in turns, like a mountain road. Every stage is one level higher.", d: "M24 160 H262 Q284 160 284 138 Q284 116 262 116 H58 Q36 116 36 94 Q36 72 58 72 H262 Q284 72 284 50 Q284 28 262 28 H206", box: "0 0 320 180" },
  { id: "horizon", name: "Horizon", line: "You look down the road towards the goal. The glow runs away from you into the distance.", d: "M160 172 L160 34", box: "0 0 320 180", extra: `<path class="guide" d="M40 176 L150 34 M280 176 L170 34"/>` },
  { id: "line", name: "Line", line: "The quietest option: the bar you have today, but as one glowing line with a spark running through it.", d: "M16 60 H304", box: "0 0 320 110" },
];
const state = Object.fromEntries(SKETCHES.map((s) => [s.id, START]));
const grid = document.getElementById("grid");
const pct = (n) => Math.min(100, (n / (PER_STAGE * STAGES.length)) * 100);

function card(s, i) {
  const el = document.createElement("section");
  el.className = "card"; el.id = s.id;
  el.innerHTML = `<div><div class="eyebrow">Sketch ${i + 1}</div><h2>${s.name}</h2></div>
    <div class="panel"><svg viewBox="${s.box}" role="img" aria-label="${s.name}: progress path">${s.extra || ""}
      <path class="ahead" pathLength="100" d="${s.d}"/><path class="halo" pathLength="100" d="${s.d}"/><path class="under" pathLength="100" d="${s.d}"/><path class="done" pathLength="100" d="${s.d}"/><path class="spark" pathLength="100" d="${s.d}"/>
      <g data-nodes></g><g class="mover" data-you><circle class="youhalo" r="9"/><circle class="you" r="6"/></g></svg>
      <div class="pmeta"><span><b data-stage></b> <span class="s" data-pos></span></span><span class="eyebrow" data-left></span></div></div>
    <p class="sub">${s.line}</p>
    <div class="row"><button class="feed" data-feed>Log a session</button><button class="reset" data-reset>Reset</button></div>`;
  grid.appendChild(el);
  const path = el.querySelector(".done"), len = path.getTotalLength(), nodes = el.querySelector("[data-nodes]");
  STAGES.forEach((name, k) => {
    const pt = path.getPointAtLength((len * (k + 1)) / STAGES.length), last = k === STAGES.length - 1;
    const horizon = s.id === "horizon", r = horizon ? 5.5 - k * 0.7 : last ? 6.5 : 4.5;
    nodes.insertAdjacentHTML("beforeend", `<circle class="node" data-k="${k}" cx="${pt.x}" cy="${pt.y}" r="${r}"/>` + (last ? `<text class="goal" x="${pt.x + (s.id === "switch" ? -14 : horizon ? 12 : -4)}" y="${pt.y + (horizon ? 4 : -12)}" text-anchor="${horizon ? "start" : "end"}">Sub‑40 10K</text>` : s.id === "line" ? `<text class="lab" x="${pt.x}" y="${pt.y + 20}" text-anchor="middle">${name}</text>` : ""));
  });
  el.querySelector("[data-feed]").addEventListener("click", () => { state[s.id] = state[s.id] >= PER_STAGE * STAGES.length ? START : state[s.id] + 1; paint(s.id, true); });
  el.querySelector("[data-reset]").addEventListener("click", () => { state[s.id] = START; paint(s.id, false); });
  paint(s.id, false);
}
function paint(id, animate) {
  const el = document.getElementById(id), n = state[id], p = pct(n), path = el.querySelector(".done"), len = path.getTotalLength();
  for (const c of ["halo", "under", "done"]) el.querySelector("." + c).style.strokeDasharray = `${p} 200`;
  el.querySelector(".spark").style.setProperty("--p", p);
  const pt = path.getPointAtLength((len * p) / 100);
  el.querySelector("[data-you]").style.transform = `translate(${pt.x}px, ${pt.y}px)`;
  const stage = Math.min(STAGES.length - 1, Math.floor(n / PER_STAGE)), inStage = n - stage * PER_STAGE;
  el.querySelectorAll(".node").forEach((node) => {
    const k = Number(node.dataset.k), lit = n >= (k + 1) * PER_STAGE, was = node.classList.contains("lit");
    node.classList.toggle("lit", lit);
    if (lit && !was && animate) { node.classList.remove("pop"); void node.getBoundingClientRect(); node.classList.add("pop"); }
  });
  el.querySelector("[data-stage]").textContent = n >= PER_STAGE * STAGES.length ? "Goal reached" : STAGES[stage];
  el.querySelector("[data-pos]").textContent = n >= PER_STAGE * STAGES.length ? "" : `· stage ${stage + 1} of ${STAGES.length}`;
  el.querySelector("[data-left]").textContent = n >= PER_STAGE * STAGES.length ? "Done" : `${PER_STAGE - inStage} sessions to next`;
}
SKETCHES.forEach(card);
document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
  document.body.dataset.panel = b.dataset.panel;
  document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
}));
</script>
</body>
</html>
