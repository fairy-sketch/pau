<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATH flat line sketches</title>
<style>
@font-face { font-family: "Satoshi"; src: url("fonts/Satoshi-Variable.woff2") format("woff2"); font-weight: 300 900; font-display: swap; }
@font-face { font-family: "Switzer"; src: url("fonts/Switzer-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Variable.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }
:root {
  /* Layout: a grid of cards, each one flat (no glow) version of the stage line, drawn straight on the app's light background. */
  --bg: #f7f7f8; --surface: #ffffff; --soft: #edf0f5; --hairline: #e1e5ec; --line: #cfd5df;
  --text: #141414; --text-2: #5f6672; --accent: #b3ff3b;
  --heading: "Satoshi", "Helvetica Neue", Arial, sans-serif;
  --body: "Switzer", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --move: .8s cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
h1, h2, p { margin: 0; }
.page { max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; }
.eyebrow { font: 500 11px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
h1 { font: 900 clamp(32px, 7vw, 44px)/1.05 var(--heading); letter-spacing: -.03em; margin: 8px 0 12px; text-wrap: balance; }
.intro { color: var(--text-2); max-width: 62ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-top: 28px; }
.card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 20px; box-shadow: 0 1px 2px rgba(17,17,17,.04), 0 6px 20px rgba(17,17,17,.05); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.card h2 { font: 700 20px/1.2 var(--heading); letter-spacing: -.01em; margin-top: 4px; }
.panel { background: var(--bg); border-radius: 16px; padding: 14px 16px; }
.panel svg { display: block; width: 100%; height: auto; overflow: visible; }
.pmeta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 4px; }
.pmeta b { font-weight: 600; }
.s, .sub { color: var(--text-2); font-size: 13px; }
.row { display: flex; gap: 8px; }
.feed { flex: 1; height: 48px; border-radius: 12px; background: var(--accent); font-weight: 600; transition: transform .12s ease; }
.feed:active { transform: scale(.96); }
.reset { height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--hairline); color: var(--text-2); font-size: 13px; font-weight: 500; }

.track { fill: none; stroke: var(--line); stroke-linecap: round; }
.fill { fill: none; stroke: var(--text); stroke-linecap: round; transition: stroke-dasharray var(--move); }
.lime { fill: none; stroke: var(--accent); stroke-linecap: round; transition: stroke-dasharray var(--move); }
.mv { transition: transform var(--move); }
.head { fill: var(--surface); stroke: var(--text); stroke-width: 3; }
.head.lime-dot { fill: var(--accent); }
.head.solid { fill: var(--text); stroke: none; }
.bump { animation: bump .5s var(--spring); transform-box: fill-box; transform-origin: center; }
@keyframes bump { 40% { transform: scale(1.5); } }
.wp { fill: var(--bg); stroke: var(--line); stroke-width: 2; transition: fill .3s ease, stroke .3s ease; }
.wp.lit { fill: var(--text); stroke: var(--text); }
.tk { stroke: var(--line); stroke-width: 1.5; stroke-linecap: round; transition: stroke .3s ease; }
.tk.lit { stroke: var(--text); }
.shim { fill: none; stroke: var(--surface); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 3 400; animation: run 2.8s cubic-bezier(.5,0,.5,1) infinite; }
@keyframes run { from { stroke-dashoffset: 3px; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { stroke-dashoffset: calc(var(--p) * -1px + 3px); opacity: 0; } }
.march { fill: none; stroke: #aab2c0; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 5 9; animation: march 1.2s linear infinite; }
@keyframes march { to { stroke-dashoffset: -14px; } }
.rt { stroke: var(--line); stroke-width: 2; stroke-linecap: round; transition: stroke .25s ease, transform .4s var(--spring); transform-box: fill-box; transform-origin: center; }
.rt.on { stroke: var(--text); transform: scaleY(1.9); }
.rt.big.on { transform: scaleY(1.5); }
.rt.next { stroke: var(--accent); stroke-width: 4; transform: scaleY(2.2); animation: nudge 1.2s ease-in-out infinite; paint-order: stroke; }
@keyframes nudge { 50% { transform: scaleY(2.2) translateY(-3px); } }
.rtn { stroke: var(--text); stroke-width: 6.5; stroke-linecap: round; transform-box: fill-box; transform-origin: center; animation: nudge2 1.2s ease-in-out infinite; }
@keyframes nudge2 { 50% { transform: translateY(-3px); } }
.st { fill: var(--bg); stroke: var(--line); stroke-width: 2; }
.st.done { fill: var(--text); stroke: var(--text); }
.st.cur { fill: var(--surface); stroke: var(--line); stroke-width: 4; }
.arc { fill: none; stroke: var(--text); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset var(--move); }
.lab { fill: var(--text-2); font: 500 7.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; }
.lab.now { fill: var(--text); font-weight: 700; }
.pill { fill: var(--accent); stroke: var(--text); stroke-width: 1.5; }
.pilltext { fill: var(--text); font: 700 9.5px var(--mono); }
@media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation: none !important; transition: none !important; } .shim { display: none; } }
</style>
</head>
<body>
<div class="page">
  <div class="eyebrow">PATH · sketches, round 4</div>
  <h1>Six lines without glow</h1>
  <p class="intro">Flat, crisp and on the normal light background. Black carries the progress; lime shows up at most once per line, as a flat fill with a dark edge. Each still moves a little and reacts when you log a session.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
"use strict";
const PER = 12, STAGES = ["Foundation", "Build", "Sharpen", "Test", "Recover"], TOTAL = PER * STAGES.length, START = PER + 5;
const X0 = 14, X1 = 306, W = X1 - X0, Y = 30, D = `M${X0} ${Y}H${X1}`;
const xAt = (n) => X0 + (W * Math.min(n, TOTAL)) / TOTAL, pct = (n) => (100 * Math.min(n, TOTAL)) / TOTAL;
const waypoints = () => STAGES.map((_, k) => `<circle class="wp" data-at="${(k + 1) * PER}" cx="${xAt((k + 1) * PER)}" cy="${Y}" r="${k === 4 ? 5 : 3.5}"/>`).join("");
const ticks = (h) => STAGES.map((_, k) => `<line class="tk" data-at="${(k + 1) * PER}" x1="${xAt((k + 1) * PER)}" x2="${xAt((k + 1) * PER)}" y1="${Y - h}" y2="${Y + h}"/>`).join("");
const SK = [
  { id: "ink", name: "Ink", line: "The plainest one: a black line that grows, a ring where you are, and a small highlight that keeps running along it.",
    svg: () => `<path class="track" stroke-width="3" d="${D}"/><path class="fill" stroke-width="4" pathLength="100" d="${D}"/><path class="shim" pathLength="100" d="${D}"/>${waypoints()}<g class="mv" data-head><circle class="head" r="6"/></g>` },
  { id: "bar", name: "Lime bar", line: "A thick flat bar. The travelled part is solid lime with a dark edge; no glow, just colour.",
    svg: () => `<path class="track" stroke-width="12" d="${D}"/><path class="fill" stroke-width="12" pathLength="100" d="${D}"/><path class="lime" stroke-width="8.5" pathLength="100" d="${D}"/>${STAGES.slice(0, 4).map((_, k) => `<line stroke="var(--bg)" stroke-width="2" x1="${xAt((k + 1) * PER)}" x2="${xAt((k + 1) * PER)}" y1="${Y - 7}" y2="${Y + 7}"/>`).join("")}` },
  { id: "ruler", name: "Ruler", line: "One tick per session. Logged ticks stand tall in black, and the next one is lime and nudges you.",
    svg: () => { let o = ""; for (let i = 1; i <= TOTAL; i++) { const x = X0 + (W * (i - 0.5)) / TOTAL, big = i % PER === 0; o += `<line class="rt ${big ? "big" : ""}" data-i="${i}" x1="${x}" x2="${x}" y1="${Y - (big ? 8 : 5)}" y2="${Y + (big ? 8 : 5)}"/>`; } return `<line class="rtn" data-under x1="0" x2="0" y1="${Y - 11}" y2="${Y + 11}"/>` + o; } },
  { id: "road", name: "Road", line: "Like a road marking: what is ahead is dashed and keeps moving towards the goal, what is behind you is solid.",
    svg: () => `<path class="march" d="${D}"/><path class="fill" stroke-width="4.5" pathLength="100" d="${D}"/>${ticks(7)}<g class="mv" data-head><circle class="head lime-dot" r="7"/></g>` },
  { id: "steps", name: "Steps", line: "Five clear stops. Finished stages are ticked off, and the current one is a ring that closes as you log.",
    svg: () => { const sx = (k) => X0 + 12 + ((W - 24) * k) / 4; let o = `<path class="track" stroke-width="3" d="M${sx(0)} ${Y - 4}H${sx(4)}"/><path class="fill" data-conn stroke-width="3" d=""/>`; STAGES.forEach((name, k) => { o += `<g data-st="${k}" transform="translate(${sx(k)} ${Y - 4})"><circle class="st" r="11"/><circle class="arc" r="11" stroke-dasharray="${2 * Math.PI * 11}" stroke-dashoffset="${2 * Math.PI * 11}" transform="rotate(-90)"/><path data-check d="M-4.5 0.5 L-1.5 3.5 L5 -3.5" fill="none" stroke="var(--surface)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle data-core class="head lime-dot" r="4.5" style="stroke-width:2"/></g><text class="lab" data-lab="${k}" x="${sx(k)}" y="${Y + 22}" text-anchor="middle">${name}</text>`; }); return o; } },
  { id: "rider", name: "Rider", line: "A small lime label rides on the line and tells you exactly where you are in the stage.",
    svg: () => `<path class="track" stroke-width="3" d="${D}"/><path class="fill" stroke-width="4" pathLength="100" d="${D}"/>${ticks(6)}<g class="mv" data-head><line x1="0" x2="0" y1="-9" y2="0" stroke="var(--text)" stroke-width="1.5"/><circle class="head solid" r="4"/><g data-pill><rect class="pill" x="-17" y="-27" width="34" height="17" rx="8.5"/><text class="pilltext" data-count x="0" y="-15" text-anchor="middle"></text></g></g>` },
];
const state = Object.fromEntries(SK.map((s) => [s.id, START]));

function paint(id, animate) {
  const el = document.getElementById(id), svg = el.querySelector("svg"), n = state[id], p = pct(n), x = xAt(n);
  const st = Math.min(4, Math.floor(n / PER)), inSt = n - st * PER, done = n >= TOTAL;
  svg.querySelectorAll(".fill:not([data-conn]), .lime").forEach((e) => { e.style.strokeDasharray = `${p} 200`; });
  const shim = svg.querySelector(".shim"); if (shim) shim.style.setProperty("--p", p);
  const head = svg.querySelector("[data-head]");
  if (head) { head.style.transform = `translate(${x}px, ${Y}px)`; if (animate) { const c = head.querySelector(".head, [data-pill]"); c.classList.remove("bump"); void c.getBoundingClientRect(); c.classList.add("bump"); } }
  svg.querySelectorAll("[data-at]").forEach((e) => e.classList.toggle("lit", n >= Number(e.dataset.at)));
  if (id === "ruler") { svg.querySelectorAll(".rt").forEach((t) => { const i = Number(t.dataset.i); t.classList.toggle("on", i <= n); t.classList.toggle("next", i === n + 1); if (i === n + 1) { const u = svg.querySelector("[data-under]"); u.setAttribute("x1", t.getAttribute("x1")); u.setAttribute("x2", t.getAttribute("x1")); u.style.display = ""; } }); if (done) svg.querySelector("[data-under]").style.display = "none"; }
  if (id === "steps") {
    const sx = (k) => X0 + 12 + ((W - 24) * k) / 4, c = 2 * Math.PI * 11;
    svg.querySelector("[data-conn]").setAttribute("d", `M${sx(0)} ${Y - 4}H${done ? sx(4) : sx(st)}`);
    STAGES.forEach((_, k) => { const g = svg.querySelector(`[data-st="${k}"]`), isDone = k < st || done, cur = k === st && !done; g.querySelector(".st").setAttribute("class", "st " + (isDone ? "done" : cur ? "cur" : "")); g.querySelector(".arc").style.strokeDashoffset = cur ? c * (1 - inSt / PER) : c; g.querySelector("[data-check]").style.display = isDone ? "" : "none"; g.querySelector("[data-core]").style.display = cur ? "" : "none"; svg.querySelector(`[data-lab="${k}"]`).setAttribute("class", "lab " + (cur ? "now" : "")); });
  }
  if (id === "rider") svg.querySelector("[data-count]").textContent = done ? "Goal" : `${inSt}/${PER}`;
  el.querySelector("[data-stage]").textContent = done ? "Goal reached" : STAGES[st];
  el.querySelector("[data-pos]").textContent = done ? "" : `· stage ${st + 1} of 5`;
  el.querySelector("[data-left]").textContent = done ? "Done" : `${PER - inSt} sessions to next`;
}
SK.forEach((s, i) => {
  const el = document.createElement("section"); el.className = "card"; el.id = s.id;
  el.innerHTML = `<div><div class="eyebrow">Line ${i + 1}</div><h2>${s.name}</h2></div><div class="panel"><svg viewBox="0 0 320 64" role="img" aria-label="${s.name}: progress line">${s.svg()}</svg><div class="pmeta"><span><b data-stage></b> <span class="s" data-pos></span></span><span class="eyebrow" data-left></span></div></div><p class="sub">${s.line}</p><div class="row"><button class="feed" data-feed>Log a session</button><button class="reset" data-reset>Reset</button></div>`;
  document.getElementById("grid").appendChild(el);
  el.querySelector("[data-feed]").addEventListener("click", () => { state[s.id] = state[s.id] >= TOTAL ? START : state[s.id] + 1; paint(s.id, true); });
  el.querySelector("[data-reset]").addEventListener("click", () => { state[s.id] = START; paint(s.id, false); });
  paint(s.id, false);
});
</script>
</body>
</html>
