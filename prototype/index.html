<style>
/* Fonts: Satoshi and Switzer (Fontshare, ITF Free Font License), self-hosted, files unmodified. */
@font-face { font-family: "Satoshi"; src: url("fonts/Satoshi-Variable.woff2") format("woff2"); font-weight: 300 900; font-style: normal; font-display: swap; }

:root {

  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-control: 12px; --r-card: 16px;

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

.sheet { background: var(--bg); width: 100%; max-width: 460px; max-height: 90%; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 12px 24px 32px; }
.sheet::before { content: ""; display: block; width: 36px; height: 4px; border-radius: 999px; background: var(--hairline); margin: 0 auto 20px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 12px 12px 12px 0; border-top: 1px solid var(--hairline); vertical-align: middle; }
th { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); border-top: 0; }
.scroll { overflow-x: auto; }

@media (min-width: 700px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
svg text { font-family: var(--mono); font-size: 10px; fill: var(--text-2); }
/* The path line: the one dark panel in the app, so the lime can glow (decisions R22). */
.linepanel { background: var(--text); color: #fff; border-radius: var(--r-card); padding: 18px 16px 14px; }
.linepanel svg { display: block; width: 100%; height: auto; overflow: visible; }
.linepanel .sub, .linepanel .eyebrow { color: #a3a8b3; }
.l-ahead { fill: none; stroke: #3a3a3a; stroke-width: 3; stroke-linecap: round; }
.l-halo { fill: none; stroke: var(--accent); stroke-width: 16; stroke-linecap: round; filter: blur(9px); opacity: .9; transition: stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1); animation: l-breathe 2.8s ease-in-out infinite; }
.l-done { fill: none; stroke: var(--accent); stroke-width: 4.5; stroke-linecap: round; transition: stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1); }

@keyframes l-run { from { stroke-dashoffset: 3px; opacity: 0; } 12% { opacity: .9; } 88% { opacity: .9; } to { stroke-dashoffset: calc(var(--p) * -1px + 2.5px); opacity: 0; } }
@keyframes l-breathe { 50% { opacity: .5; } }
.l-node { fill: var(--text); stroke: #5a5a5a; stroke-width: 2; transition: fill .3s ease, stroke .3s ease; }
.l-node.lit { fill: var(--accent); stroke: var(--text); }
.l-node.pop { animation: l-pop .6s cubic-bezier(.34,1.56,.64,1); transform-box: fill-box; transform-origin: center; }
@keyframes l-pop { 40% { transform: scale(2); } }
.l-you { transition: transform 1.1s cubic-bezier(.2,.8,.2,1); }
.l-dot { fill: var(--accent); stroke: var(--text); stroke-width: 2.5; }

@keyframes l-pulse { from { transform: scale(.6); opacity: .7; } to { transform: scale(2.2); opacity: 0; } }
.linepanel.surge .l-halo { animation: l-surge 1.4s ease-out; }
@keyframes l-surge { 30% { opacity: 1; stroke-width: 30; } }
/* Hold to log: the button charges with lime while held, then releases into the line. */
.hold { position: relative; overflow: hidden; width: 100%; min-height: 56px; border-radius: var(--r-control); background: var(--text); color: #fff; font-weight: 600; text-align: center; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: box-shadow .3s ease, transform .15s ease; }
.hold::before { content: ""; position: absolute; inset: 0; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .25s ease; }
.hold span { position: relative; transition: color .15s linear; }
.hold.holding { transform: scale(.98); box-shadow: 0 0 0 4px rgba(179,255,59,.25), 0 0 36px rgba(179,255,59,.9); transition: box-shadow .65s ease-in, transform .15s ease; }
.hold.holding::before { transform: scaleX(1); transition: transform .65s linear; }
.hold.holding span { color: var(--text); transition: color .2s linear .22s; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } .l-spark { display: none; } }
</style>

<script>
"use strict";
/* ---------- helpers ---------- */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pad = (n) => String(n).padStart(2, "0");

/* ---------- queries ---------- */
const sessList = (org) => Object.values(S.sessions).filter((s) => s.org === org).sort((a, b) => a.start - b.start);
const offOf = (s) => ORGS[s.org].offerings.find((o) => o.id === s.off);
const active = (b) => b.status === "confirmed" || b.status === "attended";
const myBooking = (sid) => S.bookings.find((b) => b.sid === sid && active(b));
const myWait = (sid) => S.waitlist.find((w) => w.sid === sid);
const spots = (s) => Math.max(0, s.cap - s.others - (myBooking(s.id) ? 1 : 0));
const booked = (s) => s.others + (myBooking(s.id) ? 1 : 0);

const err = (code, msg) => ({ ok: false, code, msg });

/* ---------- booking engine: one path for the app, the coach chat and the waitlist ---------- */
function pickPass(s) {
  const pass = S.passes.find((p) => p.org === s.org);
  if (!pass) return { err: err("NO_VALID_PASS", "You have no pass for this club. Buy one under Me.") };
  if (pass.kind === "limit") {
    const used = usedInMonth(pass.id, s.start);
    if (used >= pass.max) { const nx = new Date(s.start.getFullYear(), s.start.getMonth() + 1, 1); return { err: err("LIMIT_REACHED", `You've used ${used} of ${pass.max} drop-in sessions in ${MOL[s.start.getMonth()]}. Next one opens ${nx.getDate()} ${MOL[nx.getMonth()]}.`) }; }
    return { pass, note: `Uses ${pass.name} (${used + 1} of ${pass.max} in ${MOL[s.start.getMonth()]}).` };
  }
  const left = balance(pass.id);
  if (left <= 0) return { err: err("NO_VALID_PASS", `No credits left on your ${pass.name} pack. Buy a new pack under Me.`) };
  return { pass, note: `Uses 1 credit from ${pass.name} (${left - 1} left after).` };
}
function check(s) {
  const o = ORGS[s.org], p = o.policy, off = offOf(s);
  if (s.cancelled) return err("CANCELLED", "The club cancelled this session.");
  if (s.start <= now()) return err("WINDOW_CLOSED", "This session has already started.");
  if (myBooking(s.id)) return err("ALREADY_BOOKED", "You are already booked for this session.");
  if (myWait(s.id)) return err("ALREADY_BOOKED", "You are already on the waitlist for this session.");
  const opens = addDays(sod(s.start), -p.opensDays);
  if (now() < opens) return err("WINDOW_CLOSED", `Booking opens ${p.opensDays} days before. This one opens on ${fDay(opens)}.`);
  if (p.maxDay) {
    const sameDay = myActive(s.org).filter((b) => ymd(S.sessions[b.sid].start) === ymd(s.start)).length;
    if (sameDay >= p.maxDay) return err("LIMIT_REACHED", `You already have ${sameDay} classes on ${fDay(s.start)}. The studio allows ${p.maxDay} a day.`);
    const wk = ymd(monday(s.start)), inWeek = myActive(s.org).filter((b) => ymd(monday(S.sessions[b.sid].start)) === wk).length;
    if (inWeek >= p.maxWeek) return err("LIMIT_REACHED", `You already have ${inWeek} classes that week. The studio allows ${p.maxWeek} a week.`);
  }
  if (off.free) return { ok: true, pass: null, note: "Free session. No pass needed." };
  const r = pickPass(s); if (r.err) return r.err;
  return { ok: true, pass: r.pass, note: r.note };
}
function book(sid, source) {
  const s = S.sessions[sid], c = check(s); if (!c.ok) return c;
  if (spots(s) > 0) {
    const b = { id: S.seq++, sid, status: "confirmed", pass: c.pass ? c.pass.id : null, source };
    S.bookings.push(b);
    if (c.pass && c.pass.kind === "credits") S.ledger.push({ pass: c.pass.id, delta: -1, kind: "debit_booking", reason: `${offOf(s).name}, ${fDay(s.start)}`, at: now() });
    return { ok: true, status: "confirmed", booking: b, msg: `Booked: ${offOf(s).name}, ${fDay(s.start)} ${fTime(s.start)}. Free cancel until ${fDay(deadline(s))} ${fTime(deadline(s))}.` };
  }
  if (!ORGS[s.org].policy.waitlist) return err("SESSION_FULL", "This session is full.");
  const pos = s.waitOthers + 1; S.waitlist.push({ sid, pos });
  return { ok: true, status: "waitlisted", msg: `${offOf(s).name} is full. You are #${pos} on the waitlist. Nothing is charged until you get a spot.` };
}
function cancel(bid) {
  const b = S.bookings.find((x) => x.id === bid); if (!b || b.status !== "confirmed") return err("NOT_FOUND", "That booking is not active any more.");

}

/* ---------- training analytics (deterministic) ---------- */
function weeklyLoad() {
  const out = [];
  for (let w = 9; w >= 0; w--) { const a = addDays(TODAY, -7 * w - 6), b = addDays(a, 7); /* rolling 7-day buckets ending today */ const es = S.entries.filter((e) => e.at >= a && e.at < b); out.push({ start: a, load: es.reduce((n, e) => n + e.dur * e.rpe, 0), count: es.length }); }
  return out;
}

  return { wl, cur, avg, ratio: avg ? cur.load / avg : 0, hard: last7.filter((e) => e.rpe >= 9).length, pain: S.entries.find((e) => e.pain && !e.cleared && e.at >= addDays(TODAY, -4)) };
}

  if (st.hard >= 2) return { kind: "recover", title: "Recover today", meta: `RPE was 9 or higher ${st.hard} times this week`, cta: "Log an easy day", a: "tab", v: "log", reason: "Two very hard sessions in a week need an easy day before the next one.", factors: [`${st.hard} sessions at RPE 9+ in the last 7 days`, `Your last 7 days are at ${Math.round(st.ratio * 100)}% of your 4-week average`] };
  const y = addDays(TODAY, -1), yb = S.bookings.find((b) => active(b) && ymd(S.sessions[b.sid].start) === ymd(y));
  if (yb && !S.entries.some((e) => ymd(e.at) === ymd(y))) return { kind: "log", title: "Log yesterday's session", meta: `${offOf(S.sessions[yb.sid]).name}, ${fDay(y)}`, cta: "Log it", a: "tab", v: "log", reason: "You attended a session yesterday and have not logged how it felt.", factors: ["Your coach learns from RPE and notes"] };

  }

}

    return `<section class="pad stack-l"><div><button class="btn sm ghost" style="padding-left:0" data-a="roster" data-v="">${I(P.back, 16)}Sessions</button><div class="eyebrow" style="margin-top:8px">${fDay(s.start)} · ${fTime(s.start)} · ${booked(s)} booked</div><h1 class="h1">${offOf(s).name}</h1></div><div class="stack"><button class="btn acc full" data-a="all-present" data-v="${s.id}">Mark all present</button><div class="card rows flat">${people.map((p) => `<div class="row"><span class="mid strong">${esc(p)}</span><span class="btns">${["present", "late", "absent"].map((x) => `<button class="btn sm ${att[p] === x ? "on" : ""}" aria-pressed="${att[p] === x}" data-a="mark" data-v="${s.id}|${esc(p)}|${x}">${x[0].toUpperCase() + x.slice(1)}</button>`).join("")}</span></div>`).join("")}</div><p class="sub">Showing ${people.length} of ${booked(s)}. In the real app this works without signal and syncs later.</p></div></section>`;
  }
  if (t === "today") return `<section class="pad stack-l"><div><div class="eyebrow">Coach · ${ORGS[S.org].name}</div><h1 class="h1">Your sessions</h1></div><div class="card rows">${sessList(S.org).filter((s) => s.start > addDays(now(), -1)).slice(0, 8).map((s) => `<button class="row" data-a="roster" data-v="${s.id}"><span class="lead time" style="width:64px">${WD[s.start.getDay()]} ${s.start.getDate()}</span><span class="mid"><span class="strong">${offOf(s).name}</span><span class="sub">${fTime(s.start)} · ${offOf(s).loc}</span></span><span class="end mono">${booked(s)} / ${s.cap}${s.waitOthers ? `<span class="sub" style="display:block">${s.waitOthers + (myWait(s.id) ? 1 : 0)} waiting</span>` : ""}</span></button>`).join("")}</div></section>`;
  if (t === "athletes") {
    if (!shares("path.read") && !shares("log.read")) return `<section class="pad stack"><h1 class="h1">Your athletes</h1><p>No athlete shares their path or log with ${ORGS[S.org].name}. Coaches only see what an athlete chooses to share.</p><p class="note">Try it: switch to Athlete, open Me, and change what this club sees.</p></section>`;
    return `<section class="pad stack-l"><div><div class="eyebrow">Shared with ${ORGS[S.org].name}</div><h1 class="h1">${S.me.name}</h1>${shares("path.read") ? `<p class="sub" style="margin-top:4px">${S.goal.title} · ${S.stages[S.stage]}, ${S.stageDaysLeft} days left</p>` : `<p class="sub" style="margin-top:4px">Path not shared.</p>`}</div>
      ${shares("log.read") ? `<div class="stack"><div class="eyebrow">Training log</div><div class="card rows flat">${S.entries.slice(0, 5).map((e) => `<div class="row" style="align-items:flex-start"><span class="mid"><span class="strong">${esc(e.title)}</span><span class="sub">${fDay(e.at)} · ${e.dur} min · RPE ${e.rpe}${e.pain && shares("alerts.pain") ? " · pain " + e.painLevel : ""}</span>${e.comments.map((c) => `<span class="note" style="margin-top:8px"><span class="strong" style="color:var(--text)">${esc(c.by)}</span> ${esc(c.text)}</span>`).join("")}${shares("log.comment") ? `<form data-f="comment" data-id="${e.id}" style="display:flex;gap:8px;margin-top:8px"><input class="inp" style="min-height:40px" id="c-${e.id}" aria-label="Comment on ${esc(e.title)}" placeholder="Add a comment"><button class="btn sm" style="min-height:40px" type="submit">Send</button></form>` : ""}</span></div>`).join("")}</div></div>` : `<p class="sub">Training log not shared.</p>`}</section>`;
  }
  if (t === "review") return `<section class="pad stack-l"><h1 class="h1">Review queue</h1>${!shares("plan.write") ? `<p>${S.me.name} has not allowed coaches at this club to review plans.</p>` : S.draft.status !== "pending_review" ? `<p class="sub">Nothing is waiting. You ${S.draft.status} "${S.draft.title}".</p>` : `<div class="card stack"><div><div class="eyebrow">${S.me.name} · waiting for you</div><p class="h2" style="font-size:22px;margin-top:6px">${S.draft.title}</p></div><p class="sub">${S.draft.rationale}</p><ul class="stack" style="gap:6px">${S.draft.changes.map((c) => `<li>${c}</li>`).join("")}</ul><div class="btns"><button class="btn acc" style="flex:1" data-a="draft" data-v="approved">Approve</button><button class="btn" data-a="draft" data-v="rejected">Reject</button></div><p class="sub">A drafted plan never reaches the athlete until a coach approves it.</p></div>`}</section>`;
  const al = S.alerts.filter((a) => a.info || shares("alerts.pain"));
  return `<section class="pad stack-l"><h1 class="h1">Alerts</h1>${al.length ? `<div class="card rows flat">${al.map((a) => `<div class="row"><span class="mid"><span class="strong">${esc(a.kind)}</span><span class="sub">${S.me.name} · ${fDay(a.at)}</span></span>${a.status === "open" ? `<button class="btn sm" data-a="ack" data-v="${a.id}">Got it</button>` : `<span class="sub">Seen</span>`}</div>`).join("")}</div>` : `<p class="sub">No alerts. Pain alerts appear only for athletes who share them.</p>`}</section>`;
}
/* admin */
function vAdmin() {
  const t = S.tab.admin, o = ORGS[S.org], up = sessList(S.org).filter((s) => s.start > now());
  const tile = (n, l) => `<div class="card flat"><div class="num">${n}</div><div class="sub" style="margin-top:6px">${l}</div></div>`;
  if (t === "dash") { const wk = up.filter((s) => s.start < addDays(TODAY, 7)), fill = wk.reduce((n, s) => n + booked(s), 0) / Math.max(1, wk.reduce((n, s) => n + s.cap, 0)), open = S.invoices.filter((i) => i.org === S.org && i.status === "open"); return `<section class="pad stack-l"><div><div class="eyebrow">Admin · ${o.kind}</div><h1 class="h1">${o.name}</h1></div><div class="tiles">${tile(up.filter((s) => ymd(s.start) === ymd(TODAY)).length, "Sessions left today")}${tile(Math.round(fill * 100) + "%", "Fill rate, next 7 days")}${tile(open.length, "Open invoices")}${tile(chf(S.invoices.filter((i) => i.org === S.org && i.status === "paid").reduce((n, i) => n + i.amount, 0) + (S.org === "studio" ? (S.ledger.filter((l) => l.kind === "grant").length - 1) * 290 : 0)), "Paid in test mode")}</div><div class="stack"><div class="eyebrow">Rules for this club</div><p>${policyText(o)}</p><p class="sub">Both clubs run on the same engine. Only this data differs.</p></div></section>`; }
  if (t === "sched") return `<section class="pad stack-l"><div><h1 class="h1">Schedule</h1><p class="sub" style="margin-top:4px">"Free a spot" simulates another member cancelling, so you can watch the waitlist move.</p></div><div class="card flat scroll"><table><thead><tr><th>When</th><th>Session</th><th>Booked</th><th>Waiting</th><th></th></tr></thead><tbody>${up.slice(0, 14).map((s) => `<tr><td class="mono">${fDay(s.start)} ${fTime(s.start)}</td><td class="strong">${offOf(s).name}</td><td class="mono">${booked(s)} / ${s.cap}</td><td class="mono">${s.waitOthers + (myWait(s.id) ? 1 : 0)}</td><td><button class="btn sm" data-a="free" data-v="${s.id}">Free a spot</button></td></tr>`).join("")}</tbody></table></div></section>`;
  if (t === "members") { const pass = S.passes.find((p) => p.org === S.org); return `<section class="pad stack-l"><h1 class="h1">Members</h1><div class="card flat scroll"><table><thead><tr><th>Name</th><th>Status</th><th>Pass</th></tr></thead><tbody><tr><td class="strong">${S.me.name}</td><td>Active</td><td>${pass.name} · ${pass.kind === "limit" ? `${usedInMonth(pass.id, TODAY)} of ${pass.max} this month` : balance(pass.id) + " credits"}</td></tr>${ROSTER.map((n, i) => `<tr><td class="strong">${n}</td><td>${["Active", "Active", "Trial", "Active", "Paused"][i % 5]}</td><td>${o.products[i % o.products.length].name}</td></tr>`).join("")}</tbody></table></div>${pass.kind === "credits" ? `<form class="card stack" data-f="adjust"><p class="h2">Adjust ${S.me.name}'s credits</p><div class="two"><label class="f">Change (+ or −)<input id="adj-n" type="number" value="1"></label><label class="f">Reason (required)<input id="adj-r" placeholder="Class cancelled late"></label></div><button class="btn full" type="submit">Adjust credits</button></form>` : `<p class="sub">This pass has a monthly limit and no credits to adjust.</p>`}</section>`; }
  if (t === "products") return `<section class="pad stack-l"><h1 class="h1">Products</h1><div class="card rows flat">${o.products.map((p) => `<div class="row"><span class="mid"><span class="strong">${p.name}</span><span class="sub">${p.rule}</span></span><span class="mono strong">${chf(p.price)}</span></div>`).join("")}</div></section>`;
  const inv = S.invoices.filter((i) => i.org === S.org);
  return `<section class="pad stack-l"><h1 class="h1">Money</h1><div class="stack"><div class="eyebrow">Invoices</div>${inv.length ? `<div class="card rows flat">${inv.map((i) => `<div class="row"><span class="mid"><span class="strong">${chf(i.amount)} · ${S.me.name}</span><span class="sub">${i.id} · due ${fDay(i.due)}${i.status === "open" && i.due < TODAY ? " · overdue" : ""}</span></span>${i.status === "paid" ? `<span class="pill">${I(P.tick, 14)}Paid</span>` : `<button class="btn sm" data-a="mark-paid" data-v="${i.id}">Mark paid</button>`}</div>`).join("")}</div>` : `<p class="sub">No invoices at this club.</p>`}</div><div class="stack"><div class="eyebrow">Audit log</div>${S.audit.length ? `<div class="card rows flat">${S.audit.map((a) => `<div class="row"><span class="mid"><span>${esc(a.what)}</span><span class="sub">${fDay(a.at)} ${fTime(a.at)} · Admin</span></span></div>`).join("")}</div>` : `<p class="sub">Overrides, credit changes and manual payments are recorded here.</p>`}</div></section>`;
}

/* ---------- shell ---------- */
const TABS = { athlete: [["path", "Path", "flag"], ["coach", "Coach", "chat"], ["log", "Log", "plus"], ["week", "Week", "cal"], ["me", "Me", "user"]], coach: [["today", "Today", "cal"], ["athletes", "Athletes", "users"], ["review", "Review", "check"], ["alerts", "Alerts", "bell"]], admin: [["dash", "Home", "home"], ["sched", "Schedule", "cal"], ["members", "Members", "users"], ["products", "Products", "tag"], ["money", "Money", "card"]] };
let lastKey = "";
function render() {
  const app = document.getElementById("app"), tab = S.tab[S.role], key = S.role + tab + S.org + (S.rosterSid || ""), old = document.getElementById("view"), top = old && key === lastKey ? old.scrollTop : 0;
  const body = S.role === "athlete" ? { path: vPath, coach: vCoachChat, log: vLog, week: vWeek, me: vMe }[tab]() : S.role === "coach" ? vCoach() : vAdmin();
  const badge = S.role === "coach" ? S.alerts.filter((a) => a.status === "open" && (a.info || shares("alerts.pain"))).length : 0;
  app.className = S.role === "admin" ? "wide" : "";
  app.innerHTML = `<header class="top"><span class="name">PATH</span>
      <select id="role" aria-label="View as">${[["athlete", "Athlete"], ["coach", "Coach"], ["admin", "Admin"]].map(([v, l]) => `<option value="${v}" ${S.role === v ? "selected" : ""}>${l}</option>`).join("")}</select>
      <select id="org" aria-label="Club">${Object.entries(ORGS).map(([v, o]) => `<option value="${v}" ${S.org === v ? "selected" : ""}>${o.name}</option>`).join("")}</select></header>
    ${S.banner ? `<div class="banner"><span>Demo with made-up data. Reloading resets it.</span>${xBtn("hide-banner", "Dismiss")}</div>` : ""}
    <main id="view">${body}</main>
    ${S.toast ? `<div class="toast" role="status"><span>${esc(S.toast)}</span>${xBtn("hide-toast", "Dismiss")}</div>` : ""}
    <nav class="tabs" aria-label="Sections">${TABS[S.role].map(([v, l, ic]) => `<button data-a="tab" data-v="${v}" ${tab === v ? 'aria-current="page"' : ""}><span class="ic">${I(P[ic])}</span>${l}${v === "alerts" && badge ? ` (${badge})` : ""}</button>`).join("")}</nav>${vSheet()}`;
  const view = document.getElementById("view"); view.scrollTop = tab === "coach" && S.role === "athlete" ? view.scrollHeight : top; lastKey = key;
  if (S.sheet) { const b = app.querySelector(".sheet .btn"); if (b) b.focus(); }
  flowLine();
}
const ACT = {
  tab: (v) => { S.tab[S.role] = v; S.rosterSid = null; }, day: (v) => { S.day = v; }, logtab: (v) => { S.logTab = v; },
  sheet: (v) => { S.sheet = { type: "session", sid: v }; }, "close-btn": () => { S.sheet = null; },
  book: (v) => { const r = book(v, "app"); S.toast = r.msg; S.sheet = null; }, cancel: (v) => { S.toast = cancel(Number(v)).msg; S.sheet = null; }, leave: (v) => { S.toast = leaveWait(v).msg; S.sheet = null; },
  "go-invoices": () => { S.org = "pau"; S.tab.athlete = "me"; setTimeout(() => { const el = document.getElementById("invoices"); if (el) el.scrollIntoView(); }, 0); },
  "review-plan": () => { S.planNews = false; S.plan.title = S.draft.title.replace(" (AI draft)", ""); S.toast = `Your plan is now "${S.plan.title}", approved by Coach Sara.`; },
  "clear-pain": () => { S.entries.forEach((e) => { if (e.pain) e.cleared = true; }); S.toast = "Pain flag cleared. Hard sessions can be suggested again."; },
  rpe: (v) => { S.form.rpe = Number(v); }, pain: () => { S.form.pain = !S.form.pain; },
  ask: (v) => { S.chat.push({ who: "me", text: v }); coachReply(v); }, "prop-yes": (v) => confirmProposal(Number(v), true), "prop-no": (v) => confirmProposal(Number(v), false),
  consent: (v) => { const [o, k] = v.split("|"); if (k !== "profile.basic") { S.consent[o][k] = !S.consent[o][k]; S.toast = `${ORGS[o].name} ${S.consent[o][k] ? "can now see" : "no longer sees"} this. The change applies immediately.`; } },
  forget: (v) => { S.memory = S.memory.filter((m) => m.id !== Number(v)); S.toast = "Deleted. Your coach no longer uses it."; },
  buy: () => { const p = ORGS[S.org].products.find((x) => x.buy); S.sheet = { type: "pay", what: p.name, amount: p.price, credits: p.buy }; },
  "pay-inv": (v) => { const i = S.invoices.find((x) => x.id === v); S.sheet = { type: "pay", what: i.what, amount: i.amount, inv: v }; },
  "pay-do": (v) => { const p = S.sheet; if (p.inv) S.invoices.find((x) => x.id === p.inv).status = "paid"; else S.ledger.push({ pass: S.passes.find((x) => x.org === S.org).id, delta: p.credits, kind: "grant", reason: `Bought ${p.what}`, at: now() }); S.toast = `Test payment by ${v === "twint" ? "TWINT" : "card"} succeeded: ${chf(p.amount)}. No real money moved.`; S.sheet = null; },
  "hide-banner": () => { S.banner = false; }, "hide-toast": () => { S.toast = ""; },
  reset: () => { seed(); S.tab.athlete = "me"; S.toast = "Demo data reset."; },
  roster: (v) => { S.rosterSid = v || null; },
  mark: (v) => { const [sid, name, st] = v.split("|"); (S.attendance[sid] = S.attendance[sid] || {})[name] = st; if (name === S.me.name) { const b = myBooking(sid); if (b) b.status = st === "absent" ? "confirmed" : "attended"; } },
  "all-present": (v) => { const s = S.sessions[v], a = (S.attendance[v] = S.attendance[v] || {}); ROSTER.slice(0, Math.min(s.others, ROSTER.length)).forEach((n) => { a[n] = "present"; }); if (myBooking(v)) { a[S.me.name] = "present"; myBooking(v).status = "attended"; } S.toast = "Everyone marked present."; },
  draft: (v) => { S.draft.status = v; if (v === "approved") S.planNews = true; S.toast = v === "approved" ? `Approved. ${S.me.name} now sees it as the next step.` : "Rejected. The athlete keeps the current plan."; },
  ack: (v) => { S.alerts.find((a) => a.id === Number(v)).status = "seen"; },
  free: (v) => { S.toast = freeSpot(v); }, "mark-paid": (v) => { S.invoices.find((x) => x.id === v).status = "paid"; S.audit.unshift({ what: `Marked invoice ${v} paid (bank transfer)`, at: now() }); S.toast = "Invoice marked paid and recorded in the audit log."; },
};
document.addEventListener("click", (e) => {
  const bg = e.target.classList && e.target.classList.contains("sheetbg");
  const el = e.target.closest("[data-a]"); if (!el) return;
  if (el.dataset.a === "close") { if (!bg) return; S.sheet = null; return render(); }
  if (el.disabled) return;
  const keep = el.dataset.a === "hide-banner" ? S.toast : ""; S.toast = keep; ACT[el.dataset.a](el.dataset.v); render();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) { S.sheet = null; render(); } });
document.addEventListener("input", (e) => { const d = e.target.dataset && e.target.dataset.d; if (d) S.form[d] = e.target.value; });
document.addEventListener("change", (e) => {
  if (e.target.id === "role") { S.role = e.target.value; S.rosterSid = null; S.toast = ""; render(); }
  if (e.target.id === "org") { S.org = e.target.value; S.rosterSid = null; S.toast = ""; render(); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault(); const f = e.target.dataset.f; S.toast = "";
  if (f === "chat") { const v = document.getElementById("chat-input").value.trim(); if (v) { S.chat.push({ who: "me", text: v }); coachReply(v); } }
  if (f === "log") {
    const d = S.form, title = (document.getElementById("log-title").value || "").trim(), dur = Number(document.getElementById("log-dur").value);
    if (!title || !dur) S.toast = "Add what you did and how many minutes.";
    else if (!d.rpe) S.toast = "Tap how hard it was (RPE 1 to 10).";
    else {
      const e2 = { id: S.seq++, at: now(), title, dur, rpe: d.rpe, dist: d.dist || "", notes: d.notes || "", comments: [], pain: d.pain, painWhere: d.painWhere || "", painLevel: Number(d.painLevel || 3) };
      S.entries.unshift(e2); let msg = `Saved: ${title}, ${dur} min, RPE ${d.rpe}.`;
      const val = Number(d.value), pb = d.metric && val > 0 && S.pbs.find((p) => p.metric === d.metric);
      if (pb && (pb.better === "lower" ? val < pb.value : val > pb.value)) { msg += ` New personal best: ${pb.metric} ${val} ${pb.unit} (was ${pb.value}).`; pb.value = val; pb.at = now(); pb.isNew = true; }
      if (d.pain) { if (S.consent.pau["alerts.pain"]) { S.alerts.push({ id: S.seq++, kind: `Pain flag: ${e2.painWhere || "no location"}, level ${e2.painLevel}`, at: now(), status: "open" }); msg += " Coach Sara was alerted."; } else msg += " The pain flag stays private."; if (e2.painLevel >= 7) msg += " That is a high level: please see a doctor or physio."; }
      S.lineFrom = lineP(); S.stageSessions++;
      if (S.stageSessions >= PER && S.stage < S.stages.length - 1) { msg += ` Stage complete: ${S.stages[S.stage]}. Next up: ${S.stages[S.stage + 1]}.`; S.stage++; S.stageSessions = 0; }
      S.tab.athlete = "path";
      S.toast = msg; S.form = { rpe: 0, pain: false };
    }
  }
  if (f === "comment") { const id = Number(e.target.dataset.id), inp = document.getElementById("c-" + id), v = inp.value.trim(); if (v) { S.entries.find((x) => x.id === id).comments.push({ by: "Coach Sara", text: v }); S.toast = "Comment sent. The athlete sees it in their log."; } }
  if (f === "adjust") { const n = Number(document.getElementById("adj-n").value), r = document.getElementById("adj-r").value.trim(); if (!r) S.toast = "A reason is required for every credit change."; else if (!n) S.toast = "Enter a change other than 0."; else { const p = S.passes.find((x) => x.org === S.org); S.ledger.push({ pass: p.id, delta: n, kind: "admin_adjust", reason: "Admin: " + r, at: now() }); S.audit.unshift({ what: `Adjusted ${S.me.name}'s credits by ${n > 0 ? "+" : ""}${n}: ${r}`, at: now() }); S.toast = `Credits adjusted. New balance: ${balance(p.id)}.`; } }
  render();
});
/* Hold to log. A plain tap only nudges; keyboard and reduced-motion users get a normal press. */
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
let holdTimer = null;
function releaseHold() {
  const btn = document.querySelector("[data-hold].holding"); if (!btn || !holdTimer) return;
  clearTimeout(holdTimer); holdTimer = null; btn.classList.remove("holding");
  const label = btn.querySelector("span"); label.textContent = "Keep holding to log";
  setTimeout(() => { if (label.isConnected) label.textContent = "Hold to log"; }, 1400);
}
document.addEventListener("pointerdown", (e) => {
  const btn = e.target.closest("[data-hold]"); if (!btn || calm) return;
  btn.classList.add("holding");
  holdTimer = setTimeout(() => { holdTimer = null; btn.classList.remove("holding"); btn.closest("form").requestSubmit(); }, 650);
});
document.addEventListener("pointerup", releaseHold);
document.addEventListener("pointercancel", releaseHold);
document.addEventListener("contextmenu", (e) => { if (e.target.closest("[data-hold]")) e.preventDefault(); });
document.addEventListener("click", (e) => { const btn = e.target.closest("[data-hold]"); if (btn && (e.detail === 0 || calm)) btn.closest("form").requestSubmit(); });
seed(); render();
</script>
