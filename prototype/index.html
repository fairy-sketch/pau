<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATH clickable demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400..800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one phone-width column of dense editorial lists; black and white, one red action. */
  --ink: #000000;
  --paper: #ffffff;
  --grey-600: #5c5c5c;
  --grey-400: #a3a3a3;
  --grey-300: #d9d9d9;
  --signal: #e40513;
  --electric: #0000ff;
  --display: "Archivo", "Arial Black", "Helvetica Neue", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", "Courier New", monospace;
  --bg: var(--paper); --fg: var(--ink); --muted: var(--grey-600); --rule: var(--grey-300);
  color-scheme: light;
}
.ink { --bg: var(--ink); --fg: var(--paper); --muted: var(--grey-400); --rule: #2e2e2e; background: var(--bg); color: var(--fg); }
* { box-sizing: border-box; border-radius: 0; }
html, body { height: 100%; margin: 0; }
body { background: var(--grey-300); color: var(--ink); font: 400 14px/1.5 var(--mono); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; } ul, ol { list-style: none; }

#app { height: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; background: var(--paper); }
#app.wide { max-width: 980px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px; }
.top .name { font: italic 900 20px/1 var(--display); font-stretch: 125%; margin-right: auto; }
.top select { background: var(--ink); color: var(--paper); border: 1px solid var(--paper); min-height: 36px; padding: 0 6px; text-transform: uppercase; font-size: 11px; letter-spacing: .05em; max-width: 46%; }
.notice { background: var(--electric); color: var(--paper); padding: 6px 16px; font-size: 11px; }
#view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.tabs { display: flex; border-top: 2px solid var(--ink); background: var(--paper); }
.tabs button { flex: 1; min-height: 52px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; border-right: 1px dotted var(--ink); }
.tabs button:last-child { border-right: 0; }
.tabs button[aria-current="page"] { background: var(--ink); color: var(--paper); }

.pad { padding: 20px 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.lbl { font-size: 11px; line-height: 1.25; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
.muted { color: var(--muted); }
.b { font-weight: 700; }
.up { text-transform: uppercase; }
.disp { font: italic 900 34px/.92 var(--display); font-stretch: 125%; text-transform: uppercase; letter-spacing: -.01em; text-wrap: balance; overflow-wrap: anywhere; }
.disp.xl { font-size: clamp(34px, 10.5vw, 50px); }
.data { font-size: 26px; line-height: 1; font-weight: 700; }
.h { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; border-bottom: 2px solid var(--fg); padding-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border: 2px solid var(--fg); background: var(--fg); color: var(--bg); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; transition: background .12s cubic-bezier(.3,0,0,1), color .12s cubic-bezier(.3,0,0,1); }
.btn:hover { background: var(--bg); color: var(--fg); }
.btn.acc { background: var(--signal); border-color: var(--signal); color: var(--paper); }
.btn.acc:hover { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn.out { background: transparent; color: var(--fg); }
.btn.out:hover { background: var(--fg); color: var(--bg); }
.btn.full { width: 100%; }
.btn.sm { min-height: 36px; padding: 0 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

.chip { display: inline-flex; align-items: center; border: 1px solid var(--fg); padding: 2px 6px; font-size: 11px; line-height: 1.25; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.chip.booked { background: var(--electric); border-color: var(--electric); color: var(--paper); }
.chip.live { background: var(--fg); color: var(--bg); }
.chip.alert { background: var(--signal); border-color: var(--signal); color: var(--paper); }
.chip.demo { border-style: dashed; font-weight: 500; }

.list { border-top: 2px solid var(--fg); }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 10px 0; border-bottom: 1px dotted var(--fg); text-align: left; }
.row .lead { flex: none; width: 76px; }
.row .mid { flex: 1; min-width: 0; }
.row .mid > * { display: block; }
.row .end { flex: none; text-align: right; }
button.row:hover { background: var(--grey-300); }

.next { border: 2px solid var(--ink); padding: 14px; background: var(--paper); color: var(--ink); --fg: var(--ink); --bg: var(--paper); --muted: var(--grey-600); }
.next .title { font-size: 18px; line-height: 1.2; font-weight: 700; text-transform: uppercase; margin: 4px 0; }
details summary { cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; min-height: 32px; display: flex; align-items: center; }
details ul { padding-left: 14px; list-style: square; font-size: 12px; }

.track { overflow-x: auto; position: relative; }
.track ol { display: flex; min-width: max-content; }
.track li { min-width: 108px; flex: 1; border-top: 8px solid var(--fg); padding: 8px 10px 0 0; }
.track li.cur { border-color: var(--signal); }
.track li.todo { border-top-style: dotted; color: var(--muted); }
.track li.cur .n { background: var(--fg); color: var(--bg); padding: 0 4px; }

.ticker { overflow: hidden; border-top: 1px solid var(--fg); border-bottom: 1px solid var(--fg); white-space: nowrap; }
.ticker div { display: inline-block; padding: 7px 0; animation: tick 30s linear infinite; }
.ticker span::after { content: "—"; padding: 0 14px; }
@keyframes tick { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .ticker { overflow-x: auto; } .ticker div { animation: none; } .ticker .dup { display: none; } * { transition: none !important; } }

.strip { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 2px solid var(--fg); border-bottom: 1px dotted var(--fg); }
.strip > * { padding: 8px 2px; text-align: center; border-right: 1px dotted var(--fg); min-height: 44px; }
.strip > *:last-child { border-right: 0; }
.strip .on { background: var(--fg); color: var(--bg); }
.strip .k { font-size: 10px; font-weight: 700; text-transform: uppercase; display: block; overflow: hidden; }
.strip .s { font-size: 11px; display: block; }

.rpe { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
.rpe button { min-height: 44px; border: 1px solid var(--ink); font-weight: 700; }
.rpe button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.rpe button.hot[aria-pressed="true"] { background: var(--signal); border-color: var(--signal); }
label.f { display: flex; flex-direction: column; gap: 4px; }
.f input, .f select, .f textarea, .inp { border: 1px solid var(--ink); background: var(--paper); min-height: 44px; padding: 8px 10px; width: 100%; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tog { display: flex; align-items: center; gap: 10px; min-height: 44px; width: 100%; text-align: left; border-bottom: 1px dotted var(--fg); }
.tog .box { font-weight: 700; width: 30px; flex: none; }
.warn { border-left: 6px solid var(--signal); padding: 8px 10px; font-size: 12px; }
.toast { background: var(--ink); color: var(--paper); padding: 10px 16px; font-size: 12px; border-left: 8px solid var(--signal); }

.msg { max-width: 88%; padding: 10px 12px; border: 1px solid var(--ink); white-space: pre-line; }
.msg.me { align-self: flex-end; background: var(--ink); color: var(--paper); }
.msg.coach { align-self: flex-start; }
.prop { border: 2px solid var(--ink); padding: 12px; align-self: stretch; }
.quick { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; border-top: 1px dotted var(--ink); }
.quick button { flex: none; border: 1px solid var(--ink); min-height: 36px; padding: 0 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.chatform { display: flex; gap: 0; border-top: 2px solid var(--ink); }
.chatform input { flex: 1; border: 0; min-height: 48px; padding: 0 16px; min-width: 0; }
.chatform button { padding: 0 16px; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 11px; text-transform: uppercase; }
.chatwrap { display: flex; flex-direction: column; min-height: 100%; }
.chatlog { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 16px; }

.sheetbg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet { background: var(--paper); width: 100%; max-width: 460px; max-height: 88%; overflow-y: auto; border-top: 8px solid var(--ink); padding: 18px 16px 24px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { text-align: left; padding: 8px 8px 8px 0; border-bottom: 1px dotted var(--ink); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 2px solid var(--ink); }
.scroll { overflow-x: auto; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; border-top: 2px solid var(--ink); }
.tiles > div { padding: 12px 8px 12px 0; border-bottom: 1px dotted var(--ink); }
@media (min-width: 700px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
svg text { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pad = (n) => String(n).padStart(2, "0");
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const WDL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MO = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MOL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const now = () => new Date();
const sod = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, d.getHours(), d.getMinutes());
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fDay = (d) => `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`;
const fTime = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const chf = (n) => "CHF " + Number(n).toLocaleString("en-CH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const monday = (d) => addDays(sod(d), -((d.getDay() + 6) % 7));
const hash = (s) => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 1000) / 1000; };
const TODAY = sod(now());

/* ---------- clubs: configured purely by data ---------- */
const ORGS = {
  pau: {
    name: "PAU Trackrunning", kind: "Athletics club",
    policy: { opensDays: 60, cancelMin: 120, lateCancel: "none", waitlist: true },
    offerings: [
      { id: "track", name: "Track session", days: [1, 4], time: [18, 30], dur: 90, cap: 30, loc: "Sportanlage Fronwald", coach: "Coach Sara", intensity: "high" },
      { id: "gym", name: "Gym session", days: [2, 5], time: [18, 0], dur: 60, cap: 15, loc: "Balboa Underground", coach: "Coach Jonas", intensity: "medium" },
      { id: "community", name: "Saturday community session", days: [6], time: [10, 0], dur: 75, cap: 40, loc: "Sportanlage Fronwald", coach: "Open to everyone", intensity: "low", free: true },
    ],
    products: [
      { name: "Performance season pass", price: 600, rule: "Unlimited group sessions, valid for the season." },
      { name: "Regular season pass", price: 400, rule: "Unlimited group sessions, valid for the season." },
      { name: "Drop-in season pass", price: 300, rule: "Track and Gym sessions, max 4 per calendar month, valid for the season." },
      { name: "Free trial", price: 0, rule: "All group sessions for 7 days from the first booking. Once per person." },
      { name: "PT 10-pack", price: 900, rule: "10 personal training sessions of 90 minutes." },
    ],
  },
  studio: {
    name: "Studio Demo", kind: "Boutique studio",
    policy: { opensDays: 6, cancelMin: 240, lateCancel: "forfeit", waitlist: true, maxDay: 2, maxWeek: 7 },
    offerings: [
      { id: "strength", name: "Strength", days: [1, 2, 3, 4, 5], time: [7, 0], dur: 50, cap: 14, loc: "Studio One", coach: "Lena", intensity: "high" },
      { id: "hiit", name: "HIIT", days: [1, 2, 3, 4, 5, 0], time: [12, 15], dur: 45, cap: 16, loc: "Studio One", coach: "Marco", intensity: "high" },
      { id: "mobility", name: "Mobility", days: [1, 3, 5], time: [17, 30], dur: 45, cap: 12, loc: "Studio Two", coach: "Aylin", intensity: "low" },
      { id: "yoga", name: "Yoga flow", days: [2, 4, 0, 6], time: [18, 45], dur: 60, cap: 20, loc: "Studio Two", coach: "Noor", intensity: "low" },
      { id: "ride", name: "Ride", days: [1, 2, 3, 4], time: [19, 0], dur: 45, cap: 18, loc: "Studio One", coach: "Tim", intensity: "high" },
    ],
    products: [
      { name: "Drop-in", price: 33, rule: "1 class." },
      { name: "Starter 7 classes", price: 77, rule: "7 classes, valid 30 days. Once per person." },
      { name: "10 classes", price: 290, rule: "10 classes.", buy: 10 },
      { name: "50 classes", price: 1250, rule: "50 classes." },
      { name: "Monthly 15 classes", price: 240, rule: "15 classes a month." },
    ],
  },
};
const policyText = (o) => {
  const p = o.policy, out = [`Book up to ${p.opensDays} days ahead.`, `Free cancel until ${p.cancelMin / 60} h before.`];
  out.push(p.lateCancel === "forfeit" ? "Later than that, the credit is not returned." : "No penalty for late cancels.");
  if (p.maxDay) out.push(`Max ${p.maxWeek} bookings a week and ${p.maxDay} a day.`);
  return out.join(" ");
};
const ROSTER = ["Jana Brunner", "Luca Meier", "Sofia Rossi", "Noah Frei", "Elin Sutter", "Tariq Aziz", "Mara Vogel", "Ben Huber", "Ines Costa"];

/* ---------- state ---------- */
let S;
function seed() {
  S = {
    role: "athlete", org: "pau", tab: { athlete: "path", coach: "today", admin: "dash" }, sheet: null, toast: "", day: ymd(TODAY), logTab: "log", rosterSid: null,
    me: { name: "Mia Keller", sports: "Running · Strength" },
    goal: { title: "Sub‑40 10K", date: new Date(2027, 4, 9), why: "Because I want to race the Zurich 10K with my club." },
    stages: ["Foundation", "Build", "Sharpen", "Test", "Recover"], stage: 1, stageDaysLeft: 12,
    sessions: {}, bookings: [], waitlist: [], ledger: [], entries: [], pbs: [], chat: [], audit: [], alerts: [], attendance: {},
    passes: [
      { id: "p-pau", org: "pau", name: "Drop-in season pass", kind: "limit", max: 4, valid: "Valid until 31 Mar 2027" },
      { id: "p-studio", org: "studio", name: "10 classes", kind: "credits", valid: "No expiry in this demo" },
    ],
    invoices: [{ id: "PAU-2026-0042", org: "pau", what: "Drop-in season pass, winter season", amount: 300, due: addDays(TODAY, 9), status: "open" }],
    consent: { pau: { "profile.basic": true, "path.read": true, "log.read": true, "log.comment": true, "plan.write": true, "alerts.pain": false }, studio: { "profile.basic": true, "path.read": false, "log.read": false, "log.comment": false, "plan.write": false, "alerts.pain": false } },
    memory: [
      { id: 1, text: "Usually trains Thursday track at 18:30.", why: "Based on 6 Thursday sessions since October." },
      { id: 2, text: "Handles about 1,700 load a week comfortably.", why: "Based on your last 4 weeks of logged sessions." },
      { id: 3, text: "Prefers easy runs in the morning.", why: "You said so on 2 November." },
    ],
    plan: { title: "Build block", status: "active", by: "Coach Sara", items: [] },
    draft: { title: "Sharpen block (AI draft)", status: "pending_review", rationale: "Weekly load has been steady for 4 weeks and RPE on track sessions is falling, so the draft adds one race-pace session a week and keeps total load within +10%.", changes: ["Thu track becomes 5 × 1 km at 10K pace", "Sun long run grows from 75 to 85 min", "Wed stays a full rest day"] },
    planNews: false, form: { rpe: 0, pain: false }, seq: 100,
  };
  // sessions for 3 weeks back and 3 weeks ahead
  for (const [oid, o] of Object.entries(ORGS)) for (const off of o.offerings) for (let i = -21; i <= 20; i++) {
    const d = addDays(TODAY, i); if (!off.days.includes(d.getDay())) continue;
    const start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), off.time[0], off.time[1]);
    const id = `${oid}-${off.id}-${ymd(d)}`, h = hash(id), h2 = hash(id + "w");
    let others = oid === "pau" ? (off.id === "track" ? 17 + Math.floor(h * 10) : off.id === "gym" ? 11 + Math.floor(h * 5) : 12 + Math.floor(h * 15)) : Math.min(off.cap, Math.floor(off.cap * (0.55 + h * 0.5)));
    others = Math.min(others, off.cap);
    S.sessions[id] = { id, org: oid, off: off.id, start, cap: off.cap, others, waitOthers: others >= off.cap ? 1 + Math.floor(h2 * 3) : 0 };
  }
  // Mia's history: 3 PAU drop-ins this calendar month, a studio pack with 6 of 10 left
  const paid = sessList("pau").filter((s) => !offOf(s).free && s.start.getMonth() === TODAY.getMonth());
  const past = paid.filter((s) => s.start < now()).slice(-3), fut = paid.filter((s) => s.start > now() && s.off === "gym");
  for (const s of [...past, ...fut.slice(0, 3 - past.length)]) { s.others = Math.min(s.others, s.cap - 1); S.bookings.push({ id: S.seq++, sid: s.id, status: s.start < now() ? "attended" : "confirmed", pass: "p-pau", source: "app" }); }
  S.ledger.push({ pass: "p-studio", delta: 10, kind: "grant", reason: "Bought 10 classes", at: addDays(TODAY, -20) });
  for (let i = 0; i < 3; i++) S.ledger.push({ pass: "p-studio", delta: -1, kind: "debit_booking", reason: "Class attended", at: addDays(TODAY, -14 + i * 4) });
  const yoga = sessList("studio").find((s) => s.off === "yoga" && s.start > addDays(now(), 1) && s.others < s.cap);
  if (yoga) book(yoga.id, "app");
  // training log: 10 weeks, 3 to 4 entries a week
  const kinds = [["Track session", 90, 8], ["Easy run", 40, 4], ["Gym session", 60, 6], ["Long run", 75, 5]];
  for (let w = 10; w >= 1; w--) for (let k = 0; k < 4; k++) {
    if (k === 2 && w % 3 === 0) continue;
    const d = addDays(monday(TODAY), -7 * w + [0, 1, 3, 6][k]); if (d >= TODAY) continue;
    const [title, dur, rpe] = kinds[k], bump = (10 - w) * 2;
    S.entries.push({ id: S.seq++, at: d, title, dur: dur + (k === 3 ? bump : 0), rpe: Math.min(10, rpe + (hash(ymd(d)) > 0.8 ? 1 : 0)), notes: "", comments: [] });
  }
  for (let i = 1; i <= 2; i++) { const d = addDays(TODAY, -i - 1); S.entries.push({ id: S.seq++, at: d, title: i === 1 ? "Easy run" : "Track session", dur: i === 1 ? 40 : 90, rpe: i === 1 ? 4 : 8, notes: "", comments: [] }); }
  S.entries.sort((a, b) => b.at - a.at);
  S.entries[1].comments.push({ by: "Coach Sara", text: "Strong last two reps. Keep the first lap calmer next time." });
  S.pbs = [{ metric: "400 m", value: 63.2, unit: "s", better: "lower", at: addDays(TODAY, -23) }, { metric: "5K", value: 20.4, unit: "min", better: "lower", at: addDays(TODAY, -44) }, { metric: "Squat 1RM", value: 82.5, unit: "kg", better: "higher", at: addDays(TODAY, -31) }];
  // plan for this week and next
  const tpl = { 1: ["club", "Track session", "track"], 2: ["workout", "Easy run 40 min @ RPE 4"], 3: ["rest", "Rest day"], 4: ["club", "Track session", "track"], 5: ["club", "Gym session", "gym"], 6: ["club", "Saturday community session", "community"], 0: ["workout", "Long run 75 min @ RPE 5"] };
  for (let i = 0; i < 14; i++) { const d = addDays(monday(TODAY), i), t = tpl[d.getDay()]; S.plan.items.push({ date: ymd(d), kind: t[0], title: t[1], off: t[2] || null, status: "planned" }); }
  S.chat = [{ who: "coach", text: "Hi Mia. I can book or cancel sessions, look at your week, ease your plan or tell you how you are doing. I always ask before I change anything." }];
}

/* ---------- queries ---------- */
const sessList = (org) => Object.values(S.sessions).filter((s) => s.org === org).sort((a, b) => a.start - b.start);
const offOf = (s) => ORGS[s.org].offerings.find((o) => o.id === s.off);
const active = (b) => b.status === "confirmed" || b.status === "attended";
const myBooking = (sid) => S.bookings.find((b) => b.sid === sid && active(b));
const myWait = (sid) => S.waitlist.find((w) => w.sid === sid);
const spots = (s) => Math.max(0, s.cap - s.others - (myBooking(s.id) ? 1 : 0));
const booked = (s) => s.others + (myBooking(s.id) ? 1 : 0);
const balance = (pid) => S.ledger.filter((l) => l.pass === pid).reduce((n, l) => n + l.delta, 0);
const myActive = (org) => S.bookings.filter((b) => active(b) && S.sessions[b.sid].org === org);

/* ---------- booking engine: one path for the app, the coach chat and the waitlist ---------- */

    if (sameDay >= p.maxDay) return err("LIMIT_REACHED", `You already have ${sameDay} classes on ${fDay(s.start)}. The studio allows ${p.maxDay} a day.`);

  if (t === "dash") { const wk = up.filter((s) => s.start < addDays(TODAY, 7)), fill = wk.reduce((n, s) => n + booked(s), 0) / Math.max(1, wk.reduce((n, s) => n + s.cap, 0)), open = S.invoices.filter((i) => i.org === S.org && i.status === "open"); return `<section class="pad stack"><div><div class="lbl muted">Admin · ${o.kind}</div><h1 class="disp">${o.name}</h1></div><div class="tiles"><div><div class="data">${up.filter((s) => ymd(s.start) === ymd(TODAY)).length}</div><div class="lbl muted">Sessions left today</div></div><div><div class="data">${Math.round(fill * 100)}%</div><div class="lbl muted">Fill rate, next 7 days</div></div><div><div class="data">${open.length}</div><div class="lbl muted">Open invoices${open.some((i) => i.due < TODAY) ? " · overdue" : ""}</div></div><div><div class="data">${chf(S.invoices.filter((i) => i.org === S.org && i.status === "paid").reduce((n, i) => n + i.amount, 0) + (S.org === "studio" ? S.ledger.filter((l) => l.kind === "grant").length * 290 : 0))}</div><div class="lbl muted">Paid (sandbox)</div></div></div><h2 class="h"><span>Rules for this club</span></h2><p>${policyText(o)}</p><p class="lbl muted">Both clubs run on the same engine. Only this data differs.</p></section>`; }
  if (t === "sched") return `<section class="pad stack"><h1 class="disp">Schedule</h1><p class="lbl muted">"Free a spot" simulates another member cancelling, so you can watch the waitlist move.</p><div class="scroll"><table><thead><tr><th>When</th><th>Session</th><th>Booked</th><th>Waiting</th><th></th></tr></thead><tbody>${up.slice(0, 14).map((s) => `<tr><td class="b">${fDay(s.start)} ${fTime(s.start)}</td><td>${offOf(s).name}${s.cancelled ? ' <span class="chip">Cancelled</span>' : ""}</td><td>${booked(s)} / ${s.cap}</td><td>${s.waitOthers + (myWait(s.id) ? 1 : 0)}</td><td><button class="btn sm out" data-a="free" data-v="${s.id}">Free a spot</button></td></tr>`).join("")}</tbody></table></div></section>`;
  if (t === "members") { const pass = S.passes.find((p) => p.org === S.org); return `<section class="pad stack"><h1 class="disp">Members</h1><div class="scroll"><table><thead><tr><th>Name</th><th>Status</th><th>Pass</th></tr></thead><tbody><tr><td class="b">${S.me.name}</td><td>Active</td><td>${pass.name} · ${pass.kind === "limit" ? `${usedInMonth(pass.id, TODAY)} of ${pass.max} this month` : balance(pass.id) + " credits"}</td></tr>${ROSTER.map((n, i) => `<tr><td class="b">${n}</td><td>${["Active", "Active", "Trial", "Active", "Paused"][i % 5]}</td><td>${o.products[i % o.products.length].name}</td></tr>`).join("")}</tbody></table></div>${pass.kind === "credits" ? `<form class="stack" data-f="adjust"><h2 class="h"><span>Adjust ${S.me.name}'s credits</span></h2><div class="two"><label class="f"><span class="lbl">Change (+ or −)</span><input id="adj-n" type="number" value="1"></label><label class="f"><span class="lbl">Reason (required)</span><input id="adj-r" placeholder="e.g. class cancelled late"></label></div><button class="btn full" type="submit">[±] Adjust credits</button></form>` : `<p class="lbl muted">This pass has a monthly limit and no credits to adjust.</p>`}</section>`; }
  if (t === "products") return `<section class="pad stack"><h1 class="disp">Products</h1><ul class="list">${o.products.map((p) => `<li class="row"><span class="mid"><span class="b up">${p.name}</span><span style="font-size:12px">Members with <span class="b">${p.name}</span> get: ${p.rule}</span></span><span class="b">${chf(p.price)}</span></li>`).join("")}</ul></section>`;
  return `<section class="pad stack"><h1 class="disp">Money</h1><h2 class="h"><span>Invoices</span></h2><ul>${S.invoices.filter((i) => i.org === S.org).map((i) => `<li class="row"><span class="mid"><span class="b up">${i.id} · ${S.me.name}</span><span class="lbl muted">${esc(i.what)} · due ${fDay(i.due)}${i.status === "open" && i.due < TODAY ? " · overdue" : ""}</span></span><span class="end"><span class="b">${chf(i.amount)}</span><br>${i.status === "paid" ? '<span class="chip live">Paid</span>' : `<button class="btn sm" data-a="mark-paid" data-v="${i.id}">Mark paid</button>`}</span></li>`).join("") || `<li class="row muted">No invoices at this club.</li>`}</ul><h2 class="h"><span>Audit log</span><span class="muted">[${S.audit.length}]</span></h2><ul>${S.audit.length ? S.audit.map((a) => `<li class="row"><span class="mid"><span class="b">${esc(a.what)}</span><span class="lbl muted">${fDay(a.at)} ${fTime(a.at)} · Admin</span></span></li>`).join("") : `<li class="row muted">Overrides, credit changes and manual payments are recorded here.</li>`}</ul></section>`;
}

/* ---------- shell ---------- */
const TABS = { athlete: [["path", "Path"], ["coach", "Coach"], ["log", "Log"], ["week", "Week"], ["me", "Me"]], coach: [["today", "Today"], ["athletes", "Athletes"], ["review", "Review"], ["alerts", "Alerts"]], admin: [["dash", "Home"], ["sched", "Schedule"], ["members", "Members"], ["products", "Products"], ["money", "Money"]] };
let lastKey = "";
function render() {
  const app = document.getElementById("app"), tab = S.tab[S.role], key = S.role + tab + S.org + (S.rosterSid || ""), old = document.getElementById("view"), top = old && key === lastKey ? old.scrollTop : 0;
  const body = S.role === "athlete" ? { path: vPath, coach: vCoachChat, log: vLog, week: vWeek, me: vMe }[tab]() : S.role === "coach" ? vCoach() : vAdmin();
  const badge = S.role === "coach" ? S.alerts.filter((a) => a.status === "open" && (a.info || shares("alerts.pain"))).length : 0;
  app.className = S.role === "admin" ? "wide" : "";
  app.innerHTML = `<header class="top ink"><span class="name">PATH</span><span class="chip demo">Demo</span>
      <select id="role" aria-label="View as">${[["athlete", "Athlete: Mia"], ["coach", "Coach"], ["admin", "Club admin"]].map(([v, l]) => `<option value="${v}" ${S.role === v ? "selected" : ""}>${l}</option>`).join("")}</select>
      <select id="org" aria-label="Club">${Object.entries(ORGS).map(([v, o]) => `<option value="${v}" ${S.org === v ? "selected" : ""}>${o.name}</option>`).join("")}</select></header>
    <div class="notice">Clickable demo with made-up data. No real database, payments or AI. Reloading resets it.</div>
    ${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ""}
    <main id="view">${body}</main>
    <nav class="tabs" aria-label="Sections">${TABS[S.role].map(([v, l]) => `<button data-a="tab" data-v="${v}" ${tab === v ? 'aria-current="page"' : ""}>${l}${v === "alerts" && badge ? ` [${badge}]` : ""}</button>`).join("")}</nav>${vSheet()}`;
  const view = document.getElementById("view"); view.scrollTop = tab === "coach" && S.role === "athlete" ? view.scrollHeight : top; lastKey = key;
  if (S.sheet) { const b = app.querySelector(".sheet .btn"); if (b) b.focus(); }
}
const ACT = {
  tab: (v) => { S.tab[S.role] = v; S.rosterSid = null; }, day: (v) => { S.day = v; }, logtab: (v) => { S.logTab = v; },
  sheet: (v) => { S.sheet = { type: "session", sid: v }; }, "close-btn": () => { S.sheet = null; },
  book: (v) => { const r = book(v, "app"); S.toast = r.msg; S.sheet = null; }, cancel: (v) => { S.toast = cancel(Number(v)).msg; S.sheet = null; }, leave: (v) => { S.toast = leaveWait(v).msg; S.sheet = null; },
  "go-invoices": () => { S.org = "pau"; S.tab.athlete = "me"; setTimeout(() => { const el = document.getElementById("invoices"); if (el) el.scrollIntoView(); }, 0); },
  "review-plan": () => { S.planNews = false; S.plan.title = S.draft.title.replace(" (AI draft)", ""); S.toast = `Your plan is now "${S.plan.title}", approved by Coach Sara.`; },
  "clear-pain": () => { S.entries.forEach((e) => { if (e.pain) e.cleared = true; }); S.toast = "Pain flag cleared. Hard sessions can be suggested again."; },
  rpe: (v) => { S.form.rpe = Number(v); }, pain: () => { S.form.pain = !S.form.pain; },
  ask: (v) => { S.chat.push({ who: "me", text: v }); coachReply(v); }, "prop-yes": (v) => confirmProposal(Number(v), true), "prop-no": (v) => confirmProposal(Number(v), false),
  consent: (v) => { const [o, k] = v.split("|"); if (k !== "profile.basic") { S.consent[o][k] = !S.consent[o][k]; S.toast = `${ORGS[o].name} ${S.consent[o][k] ? "can now see" : "no longer sees"} this. The change applies immediately.`; } },
  forget: (v) => { S.memory = S.memory.filter((m) => m.id !== Number(v)); S.toast = "Deleted. Your coach no longer uses it."; },
  buy: () => { const p = ORGS[S.org].products.find((x) => x.buy); S.sheet = { type: "pay", what: p.name, amount: p.price, credits: p.buy }; },
  "pay-inv": (v) => { const i = S.invoices.find((x) => x.id === v); S.sheet = { type: "pay", what: i.what, amount: i.amount, inv: v }; },
  "pay-do": (v) => { const p = S.sheet; if (p.inv) S.invoices.find((x) => x.id === p.inv).status = "paid"; else S.ledger.push({ pass: S.passes.find((x) => x.org === S.org).id, delta: p.credits, kind: "grant", reason: `Bought ${p.what}`, at: now() }); S.toast = `Test payment by ${v === "twint" ? "TWINT" : "card"} succeeded: ${chf(p.amount)}. No real money moved.`; S.sheet = null; },
  reset: () => { seed(); S.tab.athlete = "me"; S.toast = "Demo data reset."; },
  roster: (v) => { S.rosterSid = v || null; },
  mark: (v) => { const [sid, name, st] = v.split("|"); (S.attendance[sid] = S.attendance[sid] || {})[name] = st; if (name === S.me.name) { const b = myBooking(sid); if (b) b.status = st === "absent" ? "confirmed" : "attended"; } },
  "all-present": (v) => { const s = S.sessions[v], a = (S.attendance[v] = S.attendance[v] || {}); ROSTER.slice(0, Math.min(s.others, ROSTER.length)).forEach((n) => { a[n] = "present"; }); if (myBooking(v)) { a[S.me.name] = "present"; myBooking(v).status = "attended"; } S.toast = "Everyone marked present."; },
  draft: (v) => { S.draft.status = v; if (v === "approved") S.planNews = true; S.toast = v === "approved" ? `Approved. ${S.me.name} now sees it as the next step.` : "Rejected. The athlete keeps the current plan."; },
  ack: (v) => { S.alerts.find((a) => a.id === Number(v)).status = "seen"; },
  free: (v) => { S.toast = freeSpot(v); }, "mark-paid": (v) => { S.invoices.find((x) => x.id === v).status = "paid"; S.audit.unshift({ what: `Marked invoice ${v} paid (bank transfer)`, at: now() }); S.toast = "Invoice marked paid and recorded in the audit log."; },
};
document.addEventListener("click", (e) => {
  const bg = e.target.classList && e.target.classList.contains("sheetbg");
  const el = e.target.closest("[data-a]"); if (!el) return;
  if (el.dataset.a === "close") { if (!bg) return; S.sheet = null; return render(); }
  if (el.disabled) return;
  S.toast = ""; ACT[el.dataset.a](el.dataset.v); render();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) { S.sheet = null; render(); } });
document.addEventListener("input", (e) => { const d = e.target.dataset && e.target.dataset.d; if (d) S.form[d] = e.target.value; });
document.addEventListener("change", (e) => {
  if (e.target.id === "role") { S.role = e.target.value; S.rosterSid = null; S.toast = ""; render(); }
  if (e.target.id === "org") { S.org = e.target.value; S.rosterSid = null; S.toast = ""; render(); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault(); const f = e.target.dataset.f; S.toast = "";
  if (f === "chat") { const v = document.getElementById("chat-input").value.trim(); if (v) { S.chat.push({ who: "me", text: v }); coachReply(v); } }
  if (f === "log") {
    const d = S.form, title = (document.getElementById("log-title").value || "").trim(), dur = Number(document.getElementById("log-dur").value);
    if (!title || !dur) S.toast = "Add what you did and how many minutes.";
    else if (!d.rpe) S.toast = "Tap how hard it was (RPE 1 to 10).";
    else {
      const e2 = { id: S.seq++, at: now(), title, dur, rpe: d.rpe, dist: d.dist || "", notes: d.notes || "", comments: [], pain: d.pain, painWhere: d.painWhere || "", painLevel: Number(d.painLevel || 3) };
      S.entries.unshift(e2); let msg = `Saved: ${title}, ${dur} min, RPE ${d.rpe}.`;
      const val = Number(d.value), pb = d.metric && val > 0 && S.pbs.find((p) => p.metric === d.metric);
      if (pb && (pb.better === "lower" ? val < pb.value : val > pb.value)) { msg += ` New personal best: ${pb.metric} ${val} ${pb.unit} (was ${pb.value}).`; pb.value = val; pb.at = now(); pb.isNew = true; }
      if (d.pain) { if (S.consent.pau["alerts.pain"]) { S.alerts.push({ id: S.seq++, kind: `Pain flag: ${e2.painWhere || "no location"}, level ${e2.painLevel}`, at: now(), status: "open" }); msg += " Coach Sara was alerted."; } else msg += " The pain flag stays private."; if (e2.painLevel >= 7) msg += " That is a high level: please see a doctor or physio."; }
      S.toast = msg; S.form = { rpe: 0, pain: false };
    }
  }
  if (f === "comment") { const id = Number(e.target.dataset.id), inp = document.getElementById("c-" + id), v = inp.value.trim(); if (v) { S.entries.find((x) => x.id === id).comments.push({ by: "Coach Sara", text: v }); S.toast = "Comment sent. The athlete sees it in their log."; } }
  if (f === "adjust") { const n = Number(document.getElementById("adj-n").value), r = document.getElementById("adj-r").value.trim(); if (!r) S.toast = "A reason is required for every credit change."; else if (!n) S.toast = "Enter a change other than 0."; else { const p = S.passes.find((x) => x.org === S.org); S.ledger.push({ pass: p.id, delta: n, kind: "admin_adjust", reason: "Admin: " + r, at: now() }); S.audit.unshift({ what: `Adjusted ${S.me.name}'s credits by ${n > 0 ? "+" : ""}${n}: ${r}`, at: now() }); S.toast = `Credits adjusted. New balance: ${balance(p.id)}.`; } }
  render();
});
seed(); render();
</script>
